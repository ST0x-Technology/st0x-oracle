[profile.default]
libs = ['dependencies']

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000

evm_version = "cancun"

bytecode_hash = "none"
cbor_metadata = false

# Fork tests read the Base RPC from the BASE_RPC_URL env var directly (see
# test/src/fork/) rather than a named rpc_endpoint, so a missing var in the
# per-push job no-ops loudly instead of erroring on an empty alias.

remappings = [
  # Some upstream OpenZeppelin-consuming deps use the unversioned
  # `@openzeppelin/contracts/` import prefix; bridge to the soldeer-pinned
  # install location so transitive resolution works. Same pattern as
  # st0x.deploy's foundry.toml.
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
]

[dependencies]
forge-std = "1.16.1"
"@openzeppelin-contracts" = "5.6.1"
"@openzeppelin-contracts-upgradeable" = "5.6.1"
"rain-factory" = "0.1.1"
"rain-math-float" = "0.1.1"
"rain-intorastring" = "0.1.0"
"st0x-deploy" = "0.1.1"
"rain-vats" = "0.1.5"
# Transitive dep of st0x-deploy (LibStockSplit uses LibTOFUTokenDecimals).
# `recursive_deps = false` means soldeer won't auto-pull it; declare explicit.
"rain-tofu-erc20-decimals" = "0.1.1"

[soldeer]
recursive_deps = false
