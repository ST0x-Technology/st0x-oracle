# --- Registry ---

"The OracleRegistry contract instance"
type OracleRegistry @entity {
  id: Bytes!
  "Current admin address"
  admin: Bytes!
  "All vault-to-oracle mappings"
  oracleMappings: [OracleMapping!]! @derivedFrom(field: "registry")
  "Admin change history"
  adminChanges: [RegistryAdminChange!]! @derivedFrom(field: "registry")
}

"A mapping from a vault to its oracle in the registry"
type OracleMapping @entity {
  id: Bytes!
  "The registry this mapping belongs to"
  registry: OracleRegistry!
  "The vault address"
  vault: Bytes!
  "The current oracle address"
  oracle: Bytes!
  "History of oracle changes for this vault"
  changes: [OracleChange!]! @derivedFrom(field: "mapping")
}

"An event recording an oracle change for a vault"
type OracleChange @entity(immutable: true) {
  id: Bytes!
  "The oracle mapping that changed"
  mapping: OracleMapping!
  "The vault address"
  vault: Bytes!
  "The previous oracle address"
  oldOracle: Bytes!
  "The new oracle address"
  newOracle: Bytes!
  "Block timestamp"
  timestamp: BigInt!
  "The transaction"
  transaction: Transaction!
}

"A registry admin change event"
type RegistryAdminChange @entity(immutable: true) {
  id: Bytes!
  "The registry this change belongs to"
  registry: OracleRegistry!
  "The previous admin"
  oldAdmin: Bytes!
  "The new admin"
  newAdmin: Bytes!
  "Block timestamp"
  timestamp: BigInt!
  "The transaction"
  transaction: Transaction!
}

# --- Oracle Adapters ---

"A single-feed Pyth oracle adapter"
type PythOracleAdapter @entity {
  id: Bytes!
  "The vault this oracle prices"
  vault: Bytes!
  "Pyth price feed ID"
  priceId: Bytes!
  "Maximum acceptable price age in seconds"
  maxAge: BigInt!
  "Admin address"
  admin: Bytes!
  "Whether the oracle is paused"
  isPaused: Boolean!
  "Block timestamp of initialization"
  createdAt: BigInt!
  "The transaction that created this adapter"
  createdTransaction: Transaction!
}

# --- Protocol Adapters ---

"A Morpho protocol adapter"
type MorphoProtocolAdapter @entity {
  id: Bytes!
  "The vault this adapter serves"
  vault: Bytes!
  "The oracle registry address"
  registry: Bytes!
  "Admin address"
  admin: Bytes!
  "Block timestamp of initialization"
  createdAt: BigInt!
  "The transaction that created this adapter"
  createdTransaction: Transaction!
}

"A passthrough protocol adapter (Aave/Compound/Chainlink-compatible)"
type PassthroughProtocolAdapter @entity {
  id: Bytes!
  "The vault this adapter serves"
  vault: Bytes!
  "The oracle registry address"
  registry: Bytes!
  "Admin address"
  admin: Bytes!
  "Block timestamp of initialization"
  createdAt: BigInt!
  "The transaction that created this adapter"
  createdTransaction: Transaction!
}

# --- Deployments ---

"A unified deployment (oracle + morpho + passthrough for a vault)"
type UnifiedDeployment @entity(immutable: true) {
  id: Bytes!
  "The sender who triggered the deployment"
  sender: Bytes!
  "The oracle adapter address"
  oracleAdapter: Bytes!
  "The Morpho protocol adapter address"
  morphoAdapter: Bytes!
  "The passthrough protocol adapter address"
  passthroughAdapter: Bytes!
  "Block timestamp"
  timestamp: BigInt!
  "The transaction"
  transaction: Transaction!
}

# --- Pause / Admin events (shared by adapters) ---

"A pause state change on an oracle adapter"
type PauseEvent @entity(immutable: true) {
  id: Bytes!
  "The adapter address"
  adapter: Bytes!
  "New pause state"
  isPaused: Boolean!
  "Block timestamp"
  timestamp: BigInt!
  "The transaction"
  transaction: Transaction!
}

"An admin change on an adapter or protocol adapter"
type AdapterAdminChange @entity(immutable: true) {
  id: Bytes!
  "The contract address"
  contract: Bytes!
  "The previous admin"
  oldAdmin: Bytes!
  "The new admin"
  newAdmin: Bytes!
  "Block timestamp"
  timestamp: BigInt!
  "The transaction"
  transaction: Transaction!
}

"A registry reference change on a protocol adapter"
type RegistryChange @entity(immutable: true) {
  id: Bytes!
  "The protocol adapter address"
  adapter: Bytes!
  "The previous registry"
  oldRegistry: Bytes!
  "The new registry"
  newRegistry: Bytes!
  "Block timestamp"
  timestamp: BigInt!
  "The transaction"
  transaction: Transaction!
}

# --- Common ---

type Transaction @entity(immutable: true) {
  id: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  from: Bytes!
}
