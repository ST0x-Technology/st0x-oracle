specVersion: "0.0.4"
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: OracleRegistryBeaconSetDeployer
    network: base
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: OracleRegistryBeaconSetDeployer
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transaction
      abis:
        - name: OracleRegistryBeaconSetDeployer
          file: ../out/OracleRegistryBeaconSetDeployer.sol/OracleRegistryBeaconSetDeployer.json
      eventHandlers:
        - event: Deployment(address,address)
          handler: handleRegistryDeployment
      file: ./src/deployer.ts

  - kind: ethereum/contract
    name: OracleUnifiedDeployer
    network: base
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: OracleUnifiedDeployer
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - UnifiedDeployment
        - Transaction
      abis:
        - name: OracleUnifiedDeployer
          file: ../out/OracleUnifiedDeployer.sol/OracleUnifiedDeployer.json
        - name: PythOracleAdapter
          file: ../out/PythOracleAdapter.sol/PythOracleAdapter.json
        - name: MorphoProtocolAdapter
          file: ../out/MorphoProtocolAdapter.sol/MorphoProtocolAdapter.json
        - name: PassthroughProtocolAdapter
          file: ../out/PassthroughProtocolAdapter.sol/PassthroughProtocolAdapter.json
      eventHandlers:
        - event: Deployment(address,address,address,address)
          handler: handleSingleDeployment
      file: ./src/deployer.ts

  - kind: ethereum/contract
    name: MultiOracleUnifiedDeployer
    network: base
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: MultiOracleUnifiedDeployer
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - UnifiedDeployment
        - Transaction
      abis:
        - name: MultiOracleUnifiedDeployer
          file: ../out/MultiOracleUnifiedDeployer.sol/MultiOracleUnifiedDeployer.json
        - name: MultiPythOracleAdapter
          file: ../out/MultiPythOracleAdapter.sol/MultiPythOracleAdapter.json
        - name: MorphoProtocolAdapter
          file: ../out/MorphoProtocolAdapter.sol/MorphoProtocolAdapter.json
        - name: PassthroughProtocolAdapter
          file: ../out/PassthroughProtocolAdapter.sol/PassthroughProtocolAdapter.json
      eventHandlers:
        - event: Deployment(address,address,address,address)
          handler: handleMultiDeployment
      file: ./src/deployer.ts

templates:
  - kind: ethereum/contract
    name: OracleRegistryTemplate
    network: base
    source:
      abi: OracleRegistry
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OracleRegistry
        - OracleMapping
        - OracleChange
        - RegistryAdminChange
        - Transaction
      abis:
        - name: OracleRegistry
          file: ../out/OracleRegistry.sol/OracleRegistry.json
      eventHandlers:
        - event: OracleRegistryInitialized(indexed address,(address))
          handler: handleOracleRegistryInitialized
        - event: OracleSet(indexed address,indexed address,indexed address)
          handler: handleOracleSet
        - event: AdminSet(indexed address,indexed address)
          handler: handleRegistryAdminSet
      file: ./src/registry.ts

  - kind: ethereum/contract
    name: PythOracleAdapterTemplate
    network: base
    source:
      abi: PythOracleAdapter
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PythOracleAdapter
        - PauseEvent
        - AdapterAdminChange
        - Transaction
      abis:
        - name: PythOracleAdapter
          file: ../out/PythOracleAdapter.sol/PythOracleAdapter.json
      eventHandlers:
        - event: PythOracleAdapterInitialized(indexed address,(address,bytes32,uint256,address))
          handler: handlePythOracleAdapterInitialized
        - event: PauseSet(bool)
          handler: handlePauseSet
        - event: AdminSet(indexed address,indexed address)
          handler: handleAdapterAdminSet
      file: ./src/oracle-adapter.ts

  - kind: ethereum/contract
    name: MultiPythOracleAdapterTemplate
    network: base
    source:
      abi: MultiPythOracleAdapter
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MultiPythOracleAdapter
        - FeedConfig
        - PauseEvent
        - AdapterAdminChange
        - Transaction
      abis:
        - name: MultiPythOracleAdapter
          file: ../out/MultiPythOracleAdapter.sol/MultiPythOracleAdapter.json
      eventHandlers:
        - event: MultiPythOracleAdapterInitialized(indexed address,(address,(bytes32,uint256)[],address))
          handler: handleMultiPythOracleAdapterInitialized
        - event: FeedsSet((bytes32,uint256)[])
          handler: handleFeedsSet
        - event: FeedMaxAgeSet(uint256,uint256)
          handler: handleFeedMaxAgeSet
        - event: PauseSet(bool)
          handler: handleMultiPauseSet
        - event: AdminSet(indexed address,indexed address)
          handler: handleMultiAdapterAdminSet
      file: ./src/oracle-adapter.ts

  - kind: ethereum/contract
    name: MorphoProtocolAdapterTemplate
    network: base
    source:
      abi: MorphoProtocolAdapter
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MorphoProtocolAdapter
        - AdapterAdminChange
        - RegistryChange
        - Transaction
      abis:
        - name: MorphoProtocolAdapter
          file: ../out/MorphoProtocolAdapter.sol/MorphoProtocolAdapter.json
      eventHandlers:
        - event: MorphoProtocolAdapterInitialized(indexed address,(address,address,address))
          handler: handleMorphoInitialized
        - event: AdminSet(indexed address,indexed address)
          handler: handleMorphoAdminSet
        - event: RegistrySet(indexed address,indexed address)
          handler: handleMorphoRegistrySet
      file: ./src/protocol-adapter.ts

  - kind: ethereum/contract
    name: PassthroughProtocolAdapterTemplate
    network: base
    source:
      abi: PassthroughProtocolAdapter
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PassthroughProtocolAdapter
        - AdapterAdminChange
        - RegistryChange
        - Transaction
      abis:
        - name: PassthroughProtocolAdapter
          file: ../out/PassthroughProtocolAdapter.sol/PassthroughProtocolAdapter.json
      eventHandlers:
        - event: PassthroughProtocolAdapterInitialized(indexed address,(address,address,address))
          handler: handlePassthroughInitialized
        - event: AdminSet(indexed address,indexed address)
          handler: handlePassthroughAdminSet
        - event: RegistrySet(indexed address,indexed address)
          handler: handlePassthroughRegistrySet
      file: ./src/protocol-adapter.ts
