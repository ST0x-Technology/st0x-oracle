name: Manual sol artifacts
on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy to'
        required: true
        type: choice
        options:
          - base
          - base_sepolia
          - ethereum
          - sepolia

      suite:
        description: 'Suite to deploy'
        required: true
        type: choice
        options:
          - pyth-oracle-adapter-beacon-set
          - morpho-protocol-adapter-beacon-set
          - passthrough-protocol-adapter-beacon-set
          - oracle-unified-deployer

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 1G

      - name: deploy to ${{ inputs.network }}
        run: nix develop -c rainix-sol-artifacts
        env:
          DEPLOYMENT_SUITE: ${{ inputs.suite }}
          DEPLOY_BROADCAST: '1'
          DEPLOYMENT_KEY: ${{ secrets.PRIVATE_KEY }}
          ETH_RPC_URL: ${{ secrets.RPC_URL_BASE }}
          ETHERSCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          DEPLOY_VERIFY: '1'
          DEPLOY_VERIFIER: 'etherscan'
          DEPLOY_VERIFIER_URL: 'https://api.etherscan.io/v2/api?chainid=8453'
