name: Package Release
on:
  push:
    branches:
      - main
jobs:
  release:
    # A LIBRARY repo on the rainix-autopublish next-version lifecycle:
    # `[package].version` in foundry.toml is the next unpublished registry
    # version; a content change on merge publishes it to soldeer, bumps the
    # slot, tags `sol-v<version>` and cuts a GitHub release. Deploy repos use
    # rainix-tag-release instead — this repo records no frozen deploy-pin
    # snapshots, so it is not one.
    #
    # The reusable's job requests these scopes (it pushes the bump commit and
    # tags); the caller must grant them or the run fails at startup.
    permissions:
      contents: write
      id-token: write
    uses: rainlanguage/rainix/.github/workflows/rainix-autopublish.yaml@main
    with:
      soldeer-package: st0x-oracle
    # Explicit, not `secrets: inherit`: inherit resolves every secret to
    # empty across this cross-org reusable call (probed — the same secrets
    # resolve fine in a workflow local to this repo), the same reason
    # st0x.deploy's caller passes its secrets explicitly. Only secrets the
    # reusable declares in `workflow_call` can be passed; CACHIX_AUTH_TOKEN
    # is consumed by its nix-cachix-setup composite without being declared,
    # so cachix pushing stays disabled here until rainix declares it.
    secrets:
      SOLDEER_API_TOKEN: ${{ secrets.SOLDEER_API_TOKEN }}
